name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: chores-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command npm ci
      - run: nix develop --command cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: nix develop --command cargo clippy --manifest-path backend/Cargo.toml -- -D warnings
      - run: nix develop --command cargo test --manifest-path backend/Cargo.toml
      - run: nix develop --command cargo build --manifest-path backend/Cargo.toml
      - run: nix develop --command npm run typecheck
      - run: nix develop --command npm run format:check
      - run: nix develop --command npm run build
      - run: nix develop --command npm run test:ui
      - run: nix build .#container
      - name: Check container
        run: |
          docker load -i result
          nix develop --command node scripts/verify-container.mjs
      - name: Publish private image
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/fruitiex/chores:main ghcr.io/fruitiex/chores:${{ github.sha }}
          docker push ghcr.io/fruitiex/chores:main
          docker push ghcr.io/fruitiex/chores:${{ github.sha }}
          reference="$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/fruitiex/chores:${{ github.sha }})"
          [[ "$reference" == ghcr.io/fruitiex/chores@sha256:* ]]
          printf 'digest=%s\n' "${reference##*@}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to homelab
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip superseded builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit exists on main, skipping deployment of this build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to homelab
        if: steps.check.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {
              "image": "ghcr.io/fruitiex/chores",
              "digest": "${{ needs.build.outputs.digest }}",
              "revision": "${{ github.sha }}"
            }

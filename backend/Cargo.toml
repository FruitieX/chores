[package]
name = "chores-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
argon2 = "0.6"
base64 = "0.23"
rand = "0.10"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", features = ["json"] }
[dev-dependencies]
tempfile = "3"
tower = {version="0.5",features=["util"]}
http-body-util = "0.1"

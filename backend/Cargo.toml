[package]
name = "chores-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
argon2 = "=0.6.0"
base64 = "=0.23.1"
rand = "=0.10.3"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
tower-http = { version = "=0.7.1", features = ["fs", "set-header"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
ureq = { version = "=3.5.0", features = ["json"] }
[dev-dependencies]
tempfile = "=3.27.0"
tower = {version="=0.5.3",features=["util"]}
http-body-util = "=0.1.5"

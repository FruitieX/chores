[package]
name = "chores-api"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = "0.3"
[dev-dependencies]
tempfile = "3"
tower = {version="0.5",features=["util"]}
http-body-util = "0.1"
